name: E2E Account Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP: https://afterlight-radio.vercel.app
    steps:
      - name: Exercise account lifecycle
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="afterlight-e2e-$(date +%s)@example.com"
          PASSWORD="Afterlight-E2E-$(openssl rand -hex 8)!"
          echo "EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

          SIGNUP_STATUS="$(curl --silent --show-error --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt --output /tmp/signup.json --write-out '%{http_code}' -X POST "$APP/api/auth/sign-up/email" -H 'Content-Type: application/json' --data "{\"name\":\"Afterlight E2E\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")"
          test "$SIGNUP_STATUS" -ge 200 -a "$SIGNUP_STATUS" -lt 300

          ME_STATUS="$(curl --silent --show-error --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt --output /tmp/me.json --write-out '%{http_code}' "$APP/api/me")"
          test "$ME_STATUS" = "200"
          node -e 'const x=require("fs").readFileSync("/tmp/me.json","utf8");const j=JSON.parse(x);if(!j.user?.id||j.user.email!==process.env.EMAIL||j.premium!==false)process.exit(1)'

          PREF_STATUS="$(curl --silent --show-error --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt --output /tmp/prefs.json --write-out '%{http_code}' -X PUT "$APP/api/preferences" -H 'Content-Type: application/json' --data '{"favorites":["rooftop","window"],"last_room":"window","last_track":1,"volume":61,"muted":false,"timer_end":null}')"
          test "$PREF_STATUS" = "200"

          curl --fail --silent --show-error --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt "$APP/api/me" -o /tmp/me2.json
          node -e 'const j=JSON.parse(require("fs").readFileSync("/tmp/me2.json","utf8"));const p=j.preferences;if(!p||p.last_room!=="window"||p.last_track!==1||p.volume!==61||!p.favorites.includes("rooftop")||!p.favorites.includes("window"))process.exit(1)'

          LOGOUT_STATUS="$(curl --silent --show-error --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt --output /tmp/logout.json --write-out '%{http_code}' -X POST "$APP/api/auth/sign-out" -H 'Content-Type: application/json' --data '{}')"
          test "$LOGOUT_STATUS" -ge 200 -a "$LOGOUT_STATUS" -lt 300

          AFTER_STATUS="$(curl --silent --show-error --cookie /tmp/cookies.txt --output /tmp/after.json --write-out '%{http_code}' "$APP/api/me")"
          test "$AFTER_STATUS" = "401"

          echo "ACCOUNT_E2E_EMAIL=$EMAIL"

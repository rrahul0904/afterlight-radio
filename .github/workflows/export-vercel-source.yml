name: Export Vercel Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-vercel-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployable source
        run: |
          npm install
          npm test
      - name: Package exact Git revision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --output=dist/vercel-source.zip HEAD
          unzip -l dist/vercel-source.zip | grep -q 'scripts/runtime-enhancements.js'
          unzip -l dist/vercel-source.zip | grep -q 'vercel.json'
          unzip -l dist/vercel-source.zip | grep -q 'api/index.js'
      - uses: actions/upload-artifact@v4
        with:
          name: vercel-source
          path: dist/vercel-source.zip
          if-no-files-found: error
          retention-days: 3

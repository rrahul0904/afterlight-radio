name: Verify Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'api/**'
      - 'index.html'
      - 'account.html'
      - 'legal/**'
      - 'scripts/build.mjs'
      - 'scripts/runtime-enhancements.js'
      - 'scripts/account-enhancements.js'
      - 'vercel.json'
      - '.github/workflows/verify-production.yml'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND: https://br-proud-breeze-axhwv7rx-afterlightapi.compute.c-4.us-east-2.aws.neon.tech
      APP: https://afterlight-radio.vercel.app
    steps:
      - name: Backend readiness
        shell: bash
        run: |
          set -euo pipefail
          READY="$(curl --fail --silent --show-error --retry 4 --retry-all-errors "$BACKEND/api/ready")"
          echo "$READY"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok||!x.auth||!x.database||!x.checkout||!x.webhook||x.backend!=="neon-function") process.exit(1)' "$READY"

      - name: Auth transport
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --output /tmp/session.json --write-out '%{http_code}' --retry 4 --retry-all-errors "$BACKEND/api/auth/get-session" -H "X-Afterlight-Origin: $APP")"
          test "$STATUS" = "200"

      - name: Vercel API proxy
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --retry 4 --retry-all-errors "$APP/api/health")"
          echo "$HEALTH"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok) process.exit(1)' "$HEALTH"

      - name: Homepage, room and account
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$APP/" -o /tmp/home.html
          grep -q 'Afterlight' /tmp/home.html
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$APP/rooftop/" -o /tmp/rooftop.html
          grep -q 'Nobody wants to go in' /tmp/rooftop.html
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$APP/account/" -o /tmp/account.html
          grep -q 'Your Afterlight' /tmp/account.html

      - name: Current source is actually deployed
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$APP/privacy/" -o /tmp/privacy.html
          grep -q 'Vercel for web hosting and delivery' /tmp/privacy.html
          grep -q 'Neon for authentication' /tmp/privacy.html
          if grep -q 'Supabase for authentication' /tmp/privacy.html; then echo 'Production privacy page is stale'; exit 1; fi
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$APP/terms/" -o /tmp/terms.html
          grep -q 'Until that activation is complete' /tmp/terms.html
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$APP/support/" -o /tmp/support.html
          grep -q 'Subscription cancellation' /tmp/support.html
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$APP/runtime-enhancements.js" -o /tmp/runtime.js
          grep -q 'mediaSession' /tmp/runtime.js
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$APP/account-enhancements.js" -o /tmp/account-runtime.js
          grep -q 'Billing support' /tmp/account-runtime.js

      - name: Production security headers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors -D /tmp/headers.txt -o /dev/null "$APP/"
          grep -qi '^x-frame-options: DENY' /tmp/headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/headers.txt
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/headers.txt
          grep -qi '^permissions-policy: camera=(), microphone=(), geolocation=()' /tmp/headers.txt
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/headers.txt

      - name: Audio delivery
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors "$APP/audio/rooftop/1.wav" -o /tmp/rooftop.wav
          test "$(wc -c < /tmp/rooftop.wav)" -gt 500000
          test "$(head -c 4 /tmp/rooftop.wav)" = "RIFF"

      - name: Support endpoint validation
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --output /tmp/support.json --write-out '%{http_code}' -X POST "$BACKEND/api/support" -H "X-Afterlight-Origin: $APP" -H 'Content-Type: application/json' --data '{"email":"invalid","message":"short"}')"
          test "$STATUS" = "400"
          grep -q 'valid email' /tmp/support.json

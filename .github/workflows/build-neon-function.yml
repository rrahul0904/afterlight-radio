name: Build Neon Function

on:
  push:
    branches: [main]
    paths:
      - 'functions/afterlight-lite.mjs'
      - '.github/workflows/build-neon-function.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package exact production function
        run: |
          mkdir -p dist/neon-function
          cp functions/afterlight-lite.mjs dist/neon-function/index.mjs
          node --check dist/neon-function/index.mjs
          cd dist/neon-function
          zip -9 ../afterlight-neon-function.zip index.mjs
      - name: Upload function bundle
        uses: actions/upload-artifact@v4
        with:
          name: afterlight-neon-function
          path: dist/afterlight-neon-function.zip
          if-no-files-found: error
          retention-days: 3

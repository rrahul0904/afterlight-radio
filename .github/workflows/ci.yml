name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    env:
      AFTERLIGHT_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AFTERLIGHT_AUDIO_LAB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install mastering analyzer dependency
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version
      - run: npm install
      - run: npm test
      - name: Verify exact release marker
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < public/release.txt)" = "$AFTERLIGHT_RELEASE_SHA"
      - name: Generate flagship blind listening pack
        run: >-
          node scripts/music-quality-v4-pack.mjs
          --rooms rooftop,window,headspace,last-bus
          --seeds flagship-a
          --role 1
          --bars 24
          --out .music-lab/v4-blind-ci
      - name: Run Music QA Agent on flagship candidates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/music-quality-agent.mjs \
            --rooms rooftop,window,headspace,last-bus \
            --seeds agent-ci \
            --role 1 \
            --bars 24 \
            --out .music-lab/music-agent-ci
          mkdir -p public/audio-lab
          cp .music-lab/music-agent-ci/summary.json public/audio-lab/music-agent-summary.json
          node - <<'NODE'
          const s=require('./.music-lab/music-agent-ci/summary.json');
          if(s.rejected>0){
            console.error(`Music QA Agent rejected ${s.rejected}/${s.candidateCount} flagship candidates.`);
            process.exit(1);
          }
          if(s.eligibleForHumanReview!==s.candidateCount) throw new Error('Music QA Agent summary is inconsistent');
          NODE
      - name: Write deploy bundle manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const path=require('path');
          const root='public';
          const files=[];
          function walk(dir){
            for(const name of fs.readdirSync(dir)){
              const p=path.join(dir,name),st=fs.statSync(p);
              if(st.isDirectory()) walk(p);
              else files.push({path:p,size:st.size,sha256:crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')});
            }
          }
          walk(root);
          files.sort((a,b)=>a.path.localeCompare(b.path));
          const manifest={schema:'afterlight-deploy-bundle/v1',releaseSha:process.env.AFTERLIGHT_RELEASE_SHA,fileCount:files.length,files};
          fs.writeFileSync('deploy-bundle-manifest.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
      - name: Upload exact-head deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: afterlight-deploy-${{ env.AFTERLIGHT_RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 14
          path: |
            public/
            api/
            functions/
            src/
            neon/
            vercel.json
            wrangler.jsonc
            package.json
            package-lock.json
            deploy-bundle-manifest.json
      - name: Upload Music QA Agent evidence
        uses: actions/upload-artifact@v4
        with:
          name: afterlight-music-agent-${{ env.AFTERLIGHT_RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 14
          path: .music-lab/music-agent-ci/
      - name: Upload blind flagship listening pack
        uses: actions/upload-artifact@v4
        with:
          name: afterlight-v4-blind-listening-${{ env.AFTERLIGHT_RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 14
          path: |
            .music-lab/v4-blind-ci/blind/
            .music-lab/v4-blind-ci/pack-manifest.json
      - name: Upload private treatment map
        uses: actions/upload-artifact@v4
        with:
          name: afterlight-v4-private-truth-${{ env.AFTERLIGHT_RELEASE_SHA }}
          if-no-files-found: error
          retention-days: 14
          path: .music-lab/v4-blind-ci/private/truth-map.json

name: Deploy Vercel Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'account.html'
      - 'legal/**'
      - 'api/**'
      - 'src/**'
      - 'scripts/**'
      - 'neon/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/deploy-vercel.yml'

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_zmEezpOKGZy2sH5nqTfO44LD
      VERCEL_PROJECT_ID: prj_MrkrMOOEYpE5WWrc0dhZeSXuJtUA
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::VERCEL_TOKEN is not configured. Refusing to report a successful production deploy when no deployment can run.'
            exit 1
          fi

      - name: Install and verify exact revision
        run: |
          npm install
          npm test

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7

      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy verified artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed audio artifact
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors "$DEPLOYMENT_URL/audio/rooftop/1.wav" -o /tmp/rooftop.wav
          test "$(wc -c < /tmp/rooftop.wav)" -gt 1000000
          test "$(head -c 4 /tmp/rooftop.wav)" = "RIFF"
          echo 'Rooftop audio artifact is present and non-empty.' >> "$GITHUB_STEP_SUMMARY"

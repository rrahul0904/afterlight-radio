name: Deploy Vercel Production

# Manual fallback for operators with a VERCEL_TOKEN. Production promotion can also
# be performed through the connected Vercel deployment API, but this workflow must
# never report success when authorization is missing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_zmEezpOKGZy2sH5nqTfO44LD
      VERCEL_PROJECT_ID: prj_MrkrMOOEYpE5WWrc0dhZeSXuJtUA
      AFTERLIGHT_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::VERCEL_TOKEN is not configured. No deployment was attempted.'
            exit 1
          fi

      - name: Install and verify exact revision
        run: |
          npm install
          npm test

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7

      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy verified artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed revision and audio artifact
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          LIVE_SHA="$(curl --fail --silent --show-error --retry 6 --retry-all-errors "$DEPLOYMENT_URL/release.txt" | tr -d '\r\n')"
          test "$LIVE_SHA" = "$GITHUB_SHA"
          curl --fail --silent --show-error --retry 6 --retry-all-errors "$DEPLOYMENT_URL/audio/rooftop/1.wav" -o /tmp/rooftop.wav
          test "$(wc -c < /tmp/rooftop.wav)" -gt 1000000
          test "$(head -c 4 /tmp/rooftop.wav)" = "RIFF"
          echo "Exact revision $GITHUB_SHA and Rooftop audio artifact are live." >> "$GITHUB_STEP_SUMMARY"

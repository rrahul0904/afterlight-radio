name: Deploy Vercel Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'account.html'
      - 'legal/**'
      - 'scripts/**'
      - 'api/**'
      - 'functions/**'
      - 'neon/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.github/workflows/deploy-vercel.yml'

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_zmEezpOKGZy2sH5nqTfO44LD
      VERCEL_PROJECT_ID: prj_MrkrMOOEYpE5WWrc0dhZeSXuJtUA
      AFTERLIGHT_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::VERCEL_TOKEN is not configured. No deployment was attempted.'
            exit 1
          fi

      - name: Install and verify exact revision
        run: |
          npm install
          npm test

      - name: Verify generated music catalog before deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < public/release.txt)" = "$AFTERLIGHT_RELEASE_SHA"
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('public/music-manifest.json','utf8'));
          if(m.version!==3||m.tracks?.length!==36||m.thirdPartyAudio!==false) throw new Error('Composition Engine v3 manifest is incomplete');
          if(!m.tracks.every(t=>t.generator==='afterlight-composition-engine-v3'&&t.channels===2&&t.bars===12&&t.model==='authored-elements-plus-deterministic-arrangement')) throw new Error('Unexpected music generator provenance');
          NODE

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.7

      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy verified artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          URL="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed revision, music catalog and audio
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          LIVE_SHA="$(curl --fail --silent --show-error --retry 8 --retry-all-errors "$DEPLOYMENT_URL/release.txt" | tr -d '\r\n')"
          test "$LIVE_SHA" = "$GITHUB_SHA"
          curl --fail --silent --show-error --retry 8 --retry-all-errors "$DEPLOYMENT_URL/music-manifest.json" -o /tmp/music-manifest.json
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/music-manifest.json','utf8'));
          if(m.version!==3||m.tracks?.length!==36||m.thirdPartyAudio!==false) throw new Error('Hosted music manifest is not Composition Engine v3');
          const rooftop=m.tracks.find(t=>t.id==='rooftop:1');
          if(rooftop?.title!=='Orange on the parapet'||rooftop.channels!==2||rooftop.bars!==12||rooftop.generator!=='afterlight-composition-engine-v3') throw new Error('Hosted Rooftop catalog drift');
          NODE
          curl --fail --silent --show-error --retry 8 --retry-all-errors "$DEPLOYMENT_URL/audio/rooftop/1.wav" -o /tmp/rooftop.wav
          test "$(wc -c < /tmp/rooftop.wav)" -gt 1000000
          test "$(head -c 4 /tmp/rooftop.wav)" = "RIFF"
          RANGE_HEADERS="$(curl --fail --silent --show-error --retry 8 --retry-all-errors -D - -o /tmp/range.wav -H 'Range: bytes=100-199' "$DEPLOYMENT_URL/audio/rooftop/1.wav")"
          test "$(wc -c < /tmp/range.wav)" -eq 100
          printf '%s' "$RANGE_HEADERS" | grep -qi '^content-range: bytes 100-199/'
          echo "Exact revision $GITHUB_SHA, Composition Engine v3 stereo manifest, Rooftop audio and byte-range seeking are live." >> "$GITHUB_STEP_SUMMARY"
